name: CI

on:
  push:
    branches: [main, "1.0.0-beta"]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every step in every job below is a named npm script, and `npm run verify:ci`
# is those same scripts in one command. The jobs split the list across runners
# for wall-clock time; the script keeps it in one place, so what CI checks and
# what a contributor can check locally cannot drift. A gate added here without
# being added to `verify:ci` is a gate contributors only meet after pushing,
# which is how the local-green, CI-red round trips happened. The other direction
# is checked: `npm run lint:ci-parity` fails when a `verify:ci` script is run
# by no job here, which is how `test:temporal` came to be met first by a
# release (#619).
jobs:
  verify:
    name: Verify on Node ${{ matrix.node }}
    # Pinned rather than ubuntu-latest, so a runner image rollover cannot
    # present as a change in the project.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # Node 20 is gone because the project's own tooling cannot install on it:
      # size-limit pulls nanoid 6, which requires ^22 || ^24 || >=26, and
      # `.npmrc` sets engine-strict. Testing a version the repository cannot
      # even `npm ci` on was never going to work, and claiming support for one
      # nothing exercises is worse than dropping it honestly.
      #
      # Node 26 ships Temporal unflagged, so there every default engine
      # (`calendar: "auto"`) computes dates on the runtime's own Temporal rather
      # than the Date backend, and no job ran it (#621).
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Correctness-category rules fail the build; no-explicit-any and unused
      # vars are warnings, because a backlog exists and a permanently red check
      # is one people learn to ignore. The spec files and tools are linted too:
      # a test that reads a variable it never assigned passes for the wrong
      # reason, and nothing else would notice.
      - run: npm run lint

      # Supply chain, both halves. The licence check walks the one runtime
      # dependency and everything under it against an allowlist, so a licence
      # that arrives through a transitive bump is refused rather than found by
      # a consumer's legal review. The audit fails on a high-severity advisory
      # against anything installed; Dependabot opens the bump, this is what
      # stops the release going out before it is merged.
      - run: npm run lint:licenses
      - run: npm run audit:deps

      # Type check, the default test run, and the package build.
      - run: npm run verify

  test-full:
    name: Every unit test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run verify` leaves out four suites so the normal dev cycle stays
      # fast: heavy/MemoryLeak, LexerFuzz, LexerVocabularyFuzz and
      # LongDocumentRobustness. A suite nothing runs is a suite that quietly
      # rots: when this job was first written, two of those files had decayed
      # to 49 and 13 failures against behaviour the engine had changed under
      # them. This is the run that includes them. Coverage is measured on the
      # same suite by coverage.yml, daily rather than here: the per-file v8
      # conversion made this job ten times slower, which is not a price a
      # pull-request gate can charge.
      #
      # One Node version rather than the verify matrix. These suites are slow
      # and their failures are logic failures, not version-specific ones, so a
      # three-way matrix would triple the runtime to re-prove the same thing.
      #
      # Runs single-threaded with a raised heap: the fuzz and long-document
      # suites allocate enough that parallel workers on a two-core runner start
      # failing on allocation rather than on anything real. --expose-gc is
      # load-bearing for the memory specs, which measure retention after a
      # forced collection and report noise without it.
      #
      # It also runs --forceExit, which needs justifying. Every test passes and
      # then Jest cannot exit, so the job used to sit until the runner killed it
      # ten minutes later. Three real causes were found and fixed rather than
      # papered over: QueryResolver armed an unref'd cache-eviction timer per
      # failed query, ExpressionEngine.clear() never emptied the query cache
      # whose gc timers keep a process alive, and seventy-four specs constructed
      # engines they never cleared. Something still holds the loop open after
      # all three, and --detectOpenHandles reports nothing, so there is no
      # handle left for it to name. The parallel run (test:ci) has always had
      # this masked, since Jest force-kills its workers; this makes the
      # single-process run behave the same way rather than pretending the
      # difference is a test failure.
      - run: npm run test:full

      # The landing page quotes the size of this suite. That number is only
      # worth printing if it cannot go stale, so it is derived from the run that
      # just happened and this fails when the committed copy disagrees. A pull
      # request that adds tests updates it; one that does not cannot claim a
      # total it did not produce.
      - run: npm run lint:stats

      # The VM's dispatch loop measured as ts-jest compiles it, on the Node the
      # benchmark job uses. Past V8's 61,440-byte ceiling the whole loop stops
      # being optimised and the VM runs about three times slower (#575); this
      # fails a little under it, so the crossing is seen before it lands (#689).
      - run: npm run lint:dispatch-size

  temporal:
    name: Dates in three time zones
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The date suites on the Temporal adapter in Europe/London,
      # America/New_York and Pacific/Auckland. Only the publish job ran it, so
      # the first run to meet the Auckland leg was a release: 2.38.30 and 2.40.0
      # both failed to publish on a date-relative test in the days before
      # Auckland moved its clocks, while this workflow was green on the same
      # commits (#619). A pull request opened in those days now meets the same
      # failure.
      - run: npm run test:temporal

  temporal-native:
    name: Dates on Node 26's own Temporal
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # The same date suites in the same three zones, on the runtime's own
      # Temporal instead of temporal-polyfill. CI proved the adapter only
      # against the polyfill, and a runtime Temporal that differs from what the
      # adapter expects fails at module load for every consumer (#621).
      - run: npm run test:temporal:native

  changeset:
    name: A source change carries a changeset
    # Pull requests only, and not one labelled no-changeset: a refactor or a
    # test-only change that should not reach the changelog opts out (#691).
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-changeset')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so the branch can be compared with its base.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Needs no install: it reads git and nothing else.
      - run: npm run lint:changeset -- origin/${{ github.base_ref }}

  package:
    name: Package publishes correctly
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # publint catches packaging mistakes; attw catches declarations that
      # resolve to the wrong module system. The exports map previously declared
      # one flat "types" per subpath pointing at the ESM .d.ts, which left every
      # .d.cts on disk unreachable and made a require() consumer resolve
      # ESM-flavoured declarations from an ESM package. Both tools are pinned
      # inside the script: `npx --yes <name>` would otherwise resolve to
      # whatever was published most recently and execute it against a checkout
      # of this repository.
      - run: npm run lint:package

      # Reports the bundled size; it does not gate on it. There is no budget,
      # deliberately: the engine is a language runtime and a CAS rather than a
      # utility library, and a ceiling drawn across that grows into a tax on
      # shipping features, paid by whoever happens to be holding the branch that
      # crosses it.
      #
      # Both entries land within a few dozen bytes of each other: importing only
      # ExpressionEngine costs what importing everything costs, because it
      # reaches the whole engine. Tree-shaking buys nothing here today, and the
      # second entry exists so that stops being invisible if it changes.
      - run: npm run size

      # This one does gate, on staleness rather than on size. The landing page
      # quotes the bundle size and what npm unpacks, both derived from the build
      # that just happened, so this fails when the committed copy has drifted
      # rather than letting the site claim a figure from three releases ago.
      #
      # It is also what is left of the size guard. Any change in the figure has
      # to be committed, so a jump arrives as a reviewable diff on a file whose
      # whole content is numbers, instead of arriving silently. The tarball is
      # packed under one pinned npm wherever this runs (see the script), and
      # the brotli figure on this job's Node 22, the version `.nvmrc` names, is
      # the one the committed file records.
      - run: npm run lint:size

      # The unit reference is generated by probing the built engine, so this is
      # not a formatting check: it fails when a unit stops parsing, or starts.
      # Needs the build above, which is why it lives in this job.
      - run: npm run lint:units

  consumer:
    name: Installs from the tarball on Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # The package claims Node >= 22 and the tarball is the thing a consumer
      # gets, so it is installed and used on each version the verify matrix
      # tests, not only the oldest. On 26 that is the packed tarball with the
      # runtime's own Temporal as its default date backend (#621).
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run build

      # Installs the packed tarball into a scratch project and uses it by bare
      # specifier. `npm run smoke` imports packages/engine/dist directly, which
      # is why it passed while 1.0.0-beta.0 went out containing no dist at all:
      # the files it read were on disk regardless of what got packed. This reads
      # only what npm would actually serve.
      - run: npm run test:consumer

  playground:
    name: Playground builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # The playground type-checks engine source through path aliases, so this
      # catches breakage the engine's own build would not.
      - run: npm ci --prefix playground
      - run: npm run build --prefix playground
      # The playground has its own lockfile, outside the workspaces, so the
      # root audit never sees it. Two of the three advisories open when this
      # step was added lived here.
      - run: npm audit --prefix playground --audit-level=high

  docs:
    name: Documentation builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The site imports the engine as a `file:` dependency, and that package
      # publishes only `dist`, so it has to exist before the docs install can
      # link anything usable. Without this the build fails at the point Vite
      # tries to resolve `solve-engine`, which reads as a documentation problem
      # rather than a missing build step. `pages.yml` orders it the same way.
      - run: npm run build

      - run: npm ci --prefix docs
      - run: npm run build --prefix docs

      # The sidebar lists its pages explicitly so it can be in reading order
      # rather than alphabetical. This is the cost of that: a page nobody added
      # to the list would otherwise be reachable only by search.
      - run: npm run lint:sidebar

      # Same reasoning as the playground: a lockfile the root audit cannot see.
      - run: npm audit --prefix docs --audit-level=high

  comment-style:
    name: Comment style
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Node rather than grep. The previous version of this check ran
      # `grep -P` matching the em-dash byte sequence, which exits 2 on a
      # locale it cannot handle,
      # and `if grep ...` reads exit 2 the same as "no match". So it passed on
      # every file, including the 192 carrying 1,752 violations between them. A
      # gate that cannot fail produces confidence rather than information.
      #
      # Now that the backlog is cleared this runs over the whole tree rather
      # than only changed files, so a regression anywhere fails the build.
      - run: npm run lint:comments

      # Every exported symbol outside src/packages carries a doc block, which
      # is what shows on hover and in generated documentation. The language
      # packages under src/packages are not covered yet; 55 gaps remain there.
      - run: npm run lint:docs

      # Supply chain. An action named by tag is a mutable pointer owned by
      # somebody else: it can be repointed with no diff and no review, and the
      # next run executes whatever it now points at. publish.yml runs actions in
      # a job holding `id-token: write`, so that would be unreviewed code able
      # to mint a publishing credential for this package.
      - run: npm run lint:actions

      # Each with: input is one its action declares. GitHub ignores an undeclared
      # input rather than failing the step, so a renamed one silently reverts to the
      # action's default (#691). Reads .github/action-inputs.json, no network.
      - run: npm run lint:action-inputs

      # The engine's standalone Jest config agrees with the root one; it reads
      # two config files and needs no install.
      - run: npm run lint:jest-configs

      # Every script in verify:ci is run by a job in a workflow a pull request
      # triggers. The header of this file says the two cannot drift; this is
      # what makes that true rather than hoped (#619).
      - run: npm run lint:ci-parity
