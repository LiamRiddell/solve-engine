name: Coverage

# The coverage floor, measured daily rather than on every pull request.
#
# It runs the full suite with the v8 coverage provider, which converts
# coverage for every loaded source file once per spec file: single-threaded on
# a two-core runner that turned the two and a half minute full-suite job into
# one of over twenty. A pull-request gate that slow is one people route
# around, so the floor lives here instead. As the suite grew the single run
# reached 80 to 90 minutes and half the daily runs were cancelled at the limit
# (#890), so the limit is now 150 minutes. Shards run side by side on this
# runner were tried and were slower, not faster (they contend for its memory
# and cores), so `npm run test:coverage` (`scripts/run-coverage.mjs`) runs one
# process here and checks the floor on its coverage. It fails the run when coverage
# falls under the thresholds in `jest.coverage.config.cjs`, which sit a few
# points beneath the value measured when they were set, so a real drop shows
# within a day and ordinary churn never trips it. `npm run test:coverage` is
# the same check locally, for a change that removes tests.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floor:
    name: Coverage against the floor
    # Pinned rather than ubuntu-latest, like every other job here.
    runs-on: ubuntu-24.04
    # Generous, because the point of measuring here is that it is slow.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run test:coverage

  # A scheduled run is shown to nobody: no pull request carries its result, so
  # a floor that fails, or a run that hits its time limit, used to say so only
  # in the Actions tab. That is how the run of 2026-09-25 was cancelled at its
  # 90-minute limit with the floor unmeasured and nothing reporting it (#792).
  # This reopens, or opens, one issue for the workflow, the way pages.yml does
  # for the site deploy.
  #
  # Keyed on the floor job's result rather than on `failure()`: a job that
  # reaches `timeout-minutes` concludes as cancelled, and `failure()` alone
  # stays silent for that. A manual run is watched by whoever started it, so
  # only the schedule reports.
  report:
    needs: [floor]
    if: always() && github.event_name == 'schedule' && needs.floor.result != 'success'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Say so in the tracker
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ needs.floor.result }}
        run: |
          set -euo pipefail
          title="The scheduled coverage run did not pass"

          if [ "${RESULT}" = "cancelled" ]; then
            what="was cancelled, most likely at its 150-minute limit, so the coverage floor was not measured"
          else
            what="ended with the result \`${RESULT}\`: the floor was missed, or the suite failed before it could be measured"
          fi

          cat > body.md <<BODY
          The daily coverage run on \`${GITHUB_REF_NAME}\` ${what}.

          Run: ${RUN_URL}

          Reproduce locally with \`npm run test:coverage\`.
          BODY

          # One issue, reopened and commented on, rather than a new one per run.
          number=$(gh issue list --state all --search "\"${title}\" in:title" --json number,title \
            --jq "[.[] | select(.title == \"${title}\")] | .[0].number // empty")

          if [ -n "${number}" ]; then
            gh issue reopen "${number}" || true
            gh issue comment "${number}" --body-file body.md
          else
            gh issue create --title "${title}" --body-file body.md --label bug
          fi
