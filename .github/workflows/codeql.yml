name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly published rule finds existing code rather than waiting
    # for someone to touch the file it applies to.
    - cron: "0 6 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    permissions:
      # Writing the results back is what makes them appear as code-scanning
      # alerts, which the branch ruleset on main requires before a pull request
      # can merge.
      security-events: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          # One pack covers both, since CodeQL analyses TypeScript by way of
          # JavaScript rather than as a separate language.
          languages: javascript-typescript
          # The default suite alone skips a large number of genuinely useful
          # queries. This package evaluates untrusted input by design, so the
          # extra security queries earn their runtime here.
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
