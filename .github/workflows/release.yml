name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Required for npm provenance, which signs the package against this
      # workflow run. Provenance also requires a public repository, which is why
      # the visibility flip has to happen before the first tag.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # The same gate a contributor runs: type check, tests, build, and the
      # smoke test that imports the built package the way a consumer will.
      - run: npm run verify

      - name: Check the package before publishing it
        run: |
          npx --yes publint packages/engine
          npx --yes @arethetypeswrong/cli --pack packages/engine --ignore-rules no-resolution

      - name: Confirm the tag matches the package version
        run: |
          # A tag that disagrees with package.json publishes a version nobody
          # expects, and npm will not let you replace it afterwards.
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./packages/engine/package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version $tag but package.json says $pkg."
            exit 1
          fi
          echo "Publishing $pkg."

      - name: Publish
        working-directory: packages/engine
        run: |
          # --tag beta is not optional. npm assigns `latest` by default even for
          # a prerelease version, so omitting it would make `npm i solve-engine`
          # install a beta to everyone.
          version=$(node -p "require('./package.json').version")
          case "$version" in
            *-*) dist_tag=beta ;;
            *)   dist_tag=latest ;;
          esac
          echo "Publishing with dist-tag: $dist_tag"
          npm publish --provenance --access public --tag "$dist_tag"
        env:
          # Prefer npm Trusted Publishing (OIDC) over a long-lived token. If
          # this repository is configured as a trusted publisher, NODE_AUTH_TOKEN
          # can be removed entirely.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
