name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-24.04
    # NPM_TOKEN lives in this environment rather than in a repository secret, so
    # the credential is reachable only from a run GitHub has admitted to it.
    # Without this line the secret does not resolve at all, and the symptom is
    # misleading: npm reports an authentication failure, which reads as a bad
    # token rather than as a secret that was never injected.
    environment: npm
    permissions:
      contents: read
      # Required for npm provenance, which signs the package against this
      # workflow run. Provenance also requires a public repository, which is why
      # the visibility flip has to happen before the first tag.
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Node 22 ships npm 10, and trusted publishing needs 11.5.1 or newer. The
      # failure without this does not explain itself: npm falls back to looking
      # for a token, does not find one, and reports an authentication error,
      # which points at the credential rather than at the client version.
      - name: Use an npm that understands trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      # The same gate a contributor runs: type check, tests, build, and the
      # smoke test that imports the built package the way a consumer will.
      - run: npm run verify

      - name: Check the package before publishing it
        run: |
          npx --yes publint packages/engine
          npx --yes @arethetypeswrong/cli --pack packages/engine --ignore-rules no-resolution

      - name: Confirm the tag matches the package version
        run: |
          # A tag that disagrees with package.json publishes a version nobody
          # expects, and npm will not let you replace it afterwards.
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./packages/engine/package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version $tag but package.json says $pkg."
            exit 1
          fi
          echo "Publishing $pkg."

      - name: Publish
        working-directory: packages/engine
        run: |
          # --tag beta is not optional. npm assigns `latest` by default even for
          # a prerelease version, so omitting it would make `npm i solve-engine`
          # install a beta to everyone.
          version=$(node -p "require('./package.json').version")
          case "$version" in
            *-*) dist_tag=beta ;;
            *)   dist_tag=latest ;;
          esac
          echo "Publishing with dist-tag: $dist_tag"
          # No --provenance and no NODE_AUTH_TOKEN. This repository is
          # registered as a trusted publisher for the package, so npm
          # authenticates the workflow over OIDC and generates the provenance
          # attestation on its own.
          npm publish --access public --tag "$dist_tag"
