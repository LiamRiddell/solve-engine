name: Benchmarks

on:
  # Only when something that can actually change engine throughput moves. A
  # dependency bump or a documentation edit runs the whole suite twice, sixteen
  # minutes of runner time, to compare a merge base and a head whose engine
  # source is byte-identical. That measures runner noise and nothing else, and a
  # check that reports noise is one people learn to ignore.
  pull_request:
    paths:
      - "packages/engine/src/**"
      - "packages/engine/__tests__/benchmarks/**"
      - "packages/engine/tools/**"
      - "benchmarks/thresholds.json"
      - "scripts/compare-benchmarks.mjs"
      - "jest.bench.config.cjs"
      - ".github/workflows/benchmarks.yml"
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "Run on main and open a pull request updating the committed baselines"
        type: boolean
        default: false

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compare:
    name: Compare against the merge base
    # Dependabot never touches engine source, and its token is read-only here,
    # so the comment step could not post even if the comparison were meaningful.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    # Pinned rather than ubuntu-latest. A runner image rollover would otherwise
    # present as a performance change in the project.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Both halves run on this same runner, minutes apart. That is the whole
      # point: machine variance mostly cancels between the two, which the
      # committed baselines cannot do because they were measured somewhere else
      # on some other day. Those stay useful for local comparison and for
      # watching a trend, which is a different question from "did this pull
      # request make it slower".
      - name: Benchmark the merge base
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          git checkout --detach "$base"
          npm ci
          npm run bench || echo "::warning::Benchmarks reported failures on the merge base"
          mkdir -p /tmp/bench-base
          cp packages/engine/benchmarks/current/*.json /tmp/bench-base/ 2>/dev/null || true

      - name: Benchmark this pull request
        run: |
          git checkout --force "${{ github.event.pull_request.head.sha }}"
          npm ci
          rm -rf packages/engine/benchmarks/current
          npm run bench

      - name: Compare
        run: node scripts/compare-benchmarks.mjs /tmp/bench-base packages/engine/benchmarks/current

      # A single comment updated in place, rather than one per push. Marked
      # continue-on-error because the default token cannot comment on a pull
      # request from a fork, and a missing convenience should not fail a run
      # whose real output already went to the step summary.
      - name: Comment on the pull request
        if: always()
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- benchmark-comparison -->';
            const summaryPath = process.env.GITHUB_STEP_SUMMARY;
            let body = marker + '\n';
            try {
              body += fs.readFileSync(summaryPath, 'utf8');
            } catch {
              body += 'The comparison produced no output.';
            }
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  update-baselines:
    name: Refresh the committed baselines
    if: github.event_name == 'workflow_dispatch' && inputs.update_baselines
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Measure
        run: npm run bench:baseline

      # Opens a pull request rather than committing. A baseline change is a
      # deliberate statement that the new numbers are the ones to measure
      # against from now on, and that deserves a review rather than an automatic
      # push that quietly moves the goalposts.
      - name: Open a pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/refresh-benchmark-baselines
          title: "chore: refresh benchmark baselines"
          commit-message: "chore: refresh benchmark baselines"
          body: |
            Regenerated by the Benchmarks workflow on ubuntu-24.04.

            Check the diff before merging. A large move without a matching change
            in the engine usually means the runner was noisy rather than that the
            engine got faster or slower.
          add-paths: packages/engine/benchmarks/baselines/
