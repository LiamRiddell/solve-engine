version: 2
updates:
  # Four separate ecosystems because the playground and the documentation site
  # each keep their own lockfile, deliberately, so an upgrade in one cannot
  # disturb the engine's dependency tree.
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # A compiler major is a migration, not a bump, and grouping it with
      # ordinary dev-dependency updates makes every one of those pull requests
      # unmergeable. Trying TypeScript 6 here surfaced a deprecated `baseUrl`
      # (fixed separately, since it was worth doing anyway), then missing Node
      # globals across the telemetry and error modules. Worth doing on purpose,
      # on its own branch, not as a side effect of a weekly bump.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/playground"
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/docs"
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
    # Every `uses:` is pinned to a commit SHA, and patch and minor updates are
    # accepted rather than ignored. That is the reverse of what this file said
    # before, and the reversal is the point.
    #
    # The old note argued that a floating major tag already picks up patches
    # without anyone opening a pull request, and treated that as the saving.
    # It is the exposure. A tag is a mutable pointer owned by someone else: the
    # code behind `@v1` can change at any moment, with no diff and no review,
    # and the next run executes it. `changesets/action` runs in the job that
    # holds `id-token: write`, so that is a stranger's unreviewed code holding
    # the ability to mint a publishing credential for this package. This is not
    # hypothetical; it is how tj-actions/changed-files was used to steal secrets
    # from thousands of repositories in March 2025, by repointing tags.
    #
    # A SHA cannot be repointed. The cost is a pull request when an action moves,
    # which is the review the tag was skipping. Grouped and weekly, so it
    # arrives as one batch rather than one per action.
