version: 2
updates:
  # Four separate ecosystems because the playground and the documentation site
  # each keep their own lockfile, deliberately, so an upgrade in one cannot
  # disturb the engine's dependency tree.
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # A compiler major is a migration, not a bump, and grouping it with
      # ordinary dev-dependency updates makes every one of those pull requests
      # unmergeable. Trying TypeScript 6 here surfaced a deprecated `baseUrl`
      # (fixed separately, since it was worth doing anyway), then missing Node
      # globals across the telemetry and error modules. Worth doing on purpose,
      # on its own branch, not as a side effect of a weekly bump.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/playground"
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/docs"
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]
